<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>22 аркана · 44 ассета</title><link rel="stylesheet" href="theme.css"><style>body{padding:32px}header{margin-bottom:24px}h1{font-size:36px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.pair{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}.pair h2{font-size:26px}.arts{display:grid;grid-template-columns:1fr 80px;gap:16px;align-items:center}.day{height:220px;object-fit:contain;width:100%}.mini{height:80px;width:80px;object-fit:contain}code{font-size:11px;color:var(--muted);word-break:break-all}</style><header><h1>22 аркана · 44 изображения</h1><p>Большая иллюстрация и отдельная миниатюра каждой карты.</p><a href="index.html">← Экран приложения</a></header><main class="gallery" id="gallery"></main><script src="cards.js"></script><script>document.getElementById('gallery').innerHTML=window.TAROT_CARDS.map(c=>`<article class="pair"><h2>${c.roman} · ${c.name}</h2><div class="arts"><img class="day" src="${c.day}" alt="${c.name}: карта дня"><img class="mini" src="${c.list}" alt="${c.name}: миниатюра списка"></div><code>${c.day}<br>${c.list}</code></article>`).join('')</script></html>
